<!DOCTYPE html>
   <html lang="en">
   <head>
       <meta charset="UTF-8">
       <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <title>Add Chore</title>
       <style>
           body {
               font-family: Arial, sans-serif;
               background-color: #f4f4f4;
               margin: 0;
               padding: 0;
           }
           .header {
               background-color: #333;
               color: #fff;
               padding: 10px;
               text-align: center;
           }
           .container {
               padding: 20px;
           }
           form {
               display: flex;
               flex-direction: column;
           }
           label {
               margin-bottom: 5px;
           }
           input, select {
               margin-bottom: 10px;
           }
           button {
               padding: 10px;
               background-color: #4CAF50;
               color: white;
               border: none;
               cursor: pointer;
           }
       </style>
   </head>
   <body>
       <div class="header">
           <h1>Chores List App</h1>
       </div>
       <div class="container">
           <h2>Add Chore</h2>
           <form action="{% url 'add_chore' %}" method="post">
               {% csrf_token %}
               <label for="name">Chore Name:</label>
               <input type="text" id="name" name="name" required>
               <label for="description">Description:</label>
               <textarea id="description" name="description" required></textarea>
               <label for="points">Points:</label>
               <input type="number" id="points" name="points" required>
               <label for="type">Type:</label>
               <select id="type" name="type" required>
                   <option value="general">General</option>
                   <option value="room-specific">Room-Specific</option>
               </select>
               <button type="submit">Add Chore</button>
           </form>
           <a href="{% url 'chores_list' %}">Back to Chores List</a>
       </div>
   </body>
   </html>
